name: OptiQueue CI/CD

# ───────────────────────────────────────────────────────────────
# TRIGGER CONDITIONS:
#   push to main    → full CI + Docker build + deploy to Oracle Cloud
#   pull_request    → CI only (tests + compile), no deploy
#   workflow_dispatch → manual trigger (deploy on demand)
#
# INTERVIEW Q: "What's the difference between CI and CD?"
#   CI (Continuous Integration): automatically build + test on every push.
#      Goal: catch bugs early, before they reach main branch.
#   CD (Continuous Deployment): automatically deploy on every green CI run.
#      Goal: reduce manual steps, deploy frequently, reduce blast radius of each release.
#   CD (Continuous Delivery): CI + automated packaging, but MANUAL deployment approval.
#      We implement Continuous Deployment here (fully automated).
# ───────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs on the same branch when a new commit is pushed.
# Prevents wasting CI minutes on stale commits during rapid iteration.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io                         # GitHub Container Registry
  IMAGE_NAME: ${{ github.repository }}      # e.g., kaush/optiqueue

jobs:

  # ─────────────────────────────────────────────────────────────
  # JOB 1: TEST
  # Runs all unit tests + integration tests (Testcontainers)
  # ─────────────────────────────────────────────────────────────
  test:
    name: Test (Java 21)
    runs-on: ubuntu-latest

    # Docker-in-Docker: Testcontainers needs Docker to spin up
    # Postgres and Redis containers. GitHub-hosted runners have
    # Docker pre-installed — no extra setup needed.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'      # Eclipse Temurin = OpenJDK build (same as our Docker image)
          cache: 'maven'               # Cache ~/.m2 between runs — saves ~2min per run

      # INTERVIEW Q: "Why cache Maven dependencies in CI?"
      # Each CI run downloads all dependencies from Maven Central from scratch.
      # With cache: 'maven', GitHub caches ~/.m2 between runs (keyed on pom.xml hash).
      # Cache hit: skip downloads, save 2-3 minutes per run.
      # Cache miss: download all, store in cache for next run.

      - name: Run unit tests
        run: mvn test -B --no-transfer-progress -Dtest="!JobApiIntegrationTest"

      - name: Run integration tests (Testcontainers)
        run: mvn test -B --no-transfer-progress -Dtest="JobApiIntegrationTest"
        env:
          # Testcontainers can detect and reuse Docker on the runner
          TESTCONTAINERS_RYUK_DISABLED: "false"

      - name: Upload test reports
        if: always()   # Upload even on failure — helps debug failing tests
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # JOB 2: BUILD & PUSH DOCKER IMAGE
  # Only runs after tests pass, only on push to main
  # ─────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test                           # Must pass tests first
    if: github.ref == 'refs/heads/main'  # Only on main branch, not PRs

    permissions:
      contents: read
      packages: write   # Required to push to ghcr.io

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        # Buildx enables: multi-platform builds, build cache, BuildKit features

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # Automatically provided by GitHub

      # INTERVIEW Q: "What does docker/metadata-action do?"
      # Generates image tags automatically:
      #   - main branch push → ghcr.io/kaush/optiqueue:latest
      #   - git tag v1.2.3   → ghcr.io/kaush/optiqueue:1.2.3
      #   - PR #42           → ghcr.io/kaush/optiqueue:pr-42
      # This is the standard approach — never hardcode "latest" in production.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64   # arm64 for Oracle Cloud Ampere (free tier)
          cache-from: type=gha                 # Use GitHub Actions cache for Docker layers
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_SHA=${{ github.sha }}

  # ─────────────────────────────────────────────────────────────
  # JOB 3: DEPLOY TO ORACLE CLOUD
  # SSH into the VM, pull new image, restart with docker compose
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Oracle Cloud ARM VM
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && secrets.ORACLE_VM_IP != ''

    environment:
      name: production

    steps:
      - name: Checkout code (for docker-compose.yml)
        uses: actions/checkout@v4

      # INTERVIEW Q: "How do you deploy without exposing SSH keys in code?"
      # GitHub Secrets: encrypted key-value store per repository.
      # Set via: Settings → Secrets and variables → Actions → New repository secret
      # Secrets are:
      #   - Encrypted at rest (AES-256)
      #   - Never exposed in logs (masked with ***)
      #   - Available only to jobs in the same repo
      #   - Not accessible to forked repo PRs (protection from supply chain attacks)
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_VM_IP }}
          username: ${{ secrets.ORACLE_VM_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22
          script: |
            set -e   # Exit on any error

            # Pull latest code (docker-compose.yml may have changed)
            cd ~/optiqueue
            git pull origin main

            # Log into GitHub Container Registry on the VM
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull the new image (specific sha tag for reproducibility)
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            # Graceful restart: compose recreates only the app container
            # Postgres and Redis keep running — no data loss
            docker compose up -d --no-deps app

            # Wait for healthcheck to pass (max 60s)
            sleep 15
            curl -sf http://localhost:8080/actuator/health | grep -q "UP" && \
              echo "✅ Deployment successful" || \
              (echo "❌ Health check failed" && docker compose logs app --tail=50 && exit 1)

      - name: Notify on failure
        if: failure()
        run: |
          echo "Deployment failed! Check the logs above."
          # In production, add: curl -X POST $SLACK_WEBHOOK -d '{"text":"Deploy failed"}'
