# ═══════════════════════════════════════════════════════════════════
# render.yaml — Safe Zero-Cost Deployment Blueprint for Render.com
# ═══════════════════════════════════════════════════════════════════
# COST SAFETY NOTICE:
# Render's native managed PostgreSQL expires and is DELETED after 30 days
# on the free tier. To guarantee ZERO COST with permanent data durability,
# configure OptiQueue to use free persistent database providers:
#   1. Database: Neon (https://neon.tech) — Free 0.5 GB Postgres (no card)
#   2. Redis: Upstash (https://upstash.com) — Free 10k cmds/day Redis (no card)
# ═══════════════════════════════════════════════════════════════════

services:
  # OptiQueue Main Web Application & Worker (Free Web Service)
  - type: web
    name: optiqueue-app
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Inject connection strings from your free Neon / Supabase database
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      # Inject connection strings from your free Upstash Redis instance
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_PASS
        sync: false
      - key: SECURITY_API_KEYS
        generateValue: true

