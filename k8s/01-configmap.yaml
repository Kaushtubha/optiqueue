apiVersion: v1
kind: Namespace
metadata:
  name: optiqueue
  labels:
    app.kubernetes.io/name: optiqueue
    app.kubernetes.io/part-of: optiqueue-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: optiqueue-config
  namespace: optiqueue
  labels:
    app.kubernetes.io/name: optiqueue
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8080"
  OPTIQUEUE_WORKER_POOL_SIZE: "16"
  OPTIQUEUE_WORKER_MAX_POOL_SIZE: "32"
  OPTIQUEUE_WORKER_QUEUE_CAPACITY: "500"
  OPTIQUEUE_SCHEDULER_POLL_INTERVAL_MS: "2000"
  OPTIQUEUE_HEARTBEAT_INTERVAL_MS: "5000"
  OPTIQUEUE_HEARTBEAT_TTL_MS: "30000"
  RETRY_MAX_RETRIES: "5"
  RETRY_INITIAL_DELAY_MS: "1000"
  RETRY_USE_JITTER: "true"
