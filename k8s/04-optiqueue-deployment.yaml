apiVersion: v1
kind: Service
metadata:
  name: optiqueue-service
  namespace: optiqueue
  labels:
    app.kubernetes.io/name: optiqueue
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app.kubernetes.io/name: optiqueue
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: optiqueue
  namespace: optiqueue
  labels:
    app.kubernetes.io/name: optiqueue
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: optiqueue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: optiqueue
    spec:
      containers:
        - name: optiqueue
          image: optiqueue:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: optiqueue-config
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-service.optiqueue.svc.cluster.local:5432/optiqueue"
            - name: SPRING_DATA_REDIS_HOST
              value: "redis-service.optiqueue.svc.cluster.local"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
