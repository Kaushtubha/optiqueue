version: 2
updates:
  # Maintain dependencies for Maven
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    groups:
      spring-framework:
        patterns:
          - "org.springframework*"
      database-drivers:
        patterns:
          - "org.postgresql*"
          - "org.flywaydb*"
      test-frameworks:
        patterns:
          - "org.junit*"
          - "org.mockito*"
          - "org.testcontainers*"

  # Maintain GitHub Actions workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
