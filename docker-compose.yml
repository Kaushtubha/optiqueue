# ═══════════════════════════════════════════════════════════════════════
# docker-compose.yml — OptiQueue local development stack
#
# Services:
#   postgres  — PostgreSQL 16 (job metadata + history)
#   redis     — Redis 7 (queue state + worker heartbeats)
#   app       — Spring Boot application (built from Dockerfile)
#
# STARTUP ORDER CONTRACT:
#   app depends_on postgres (healthy) and redis (healthy)
#   This means Docker will:
#     1. Start postgres, wait until its healthcheck passes
#     2. Start redis, wait until its healthcheck passes
#     3. Only then start app
#   Without `condition: service_healthy`, depends_on only waits for
#   the container PROCESS to start — not for the DB to accept connections.
#   This is one of the most common Docker Compose bugs in interviews.
# ═══════════════════════════════════════════════════════════════════════

# Named volume: data persists across `docker compose down` + `up`.
# Without this, every restart wipes your DB — fine for CI, bad for dev.
volumes:
  postgres_data:
  redis_data:

networks:
  optiqueue_net:
    driver: bridge

services:

  # ── POSTGRESQL ─────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine          # Alpine = smaller image (~85MB vs ~375MB)
    container_name: optiqueue-postgres
    restart: unless-stopped            # Auto-restart unless explicitly stopped
    environment:
      POSTGRES_DB: optiqueue
      POSTGRES_USER: optiqueue
      POSTGRES_PASSWORD: optiqueue
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"                    # Expose for local DB tools (DBeaver, psql) — host:5434, free port
    networks:
      - optiqueue_net
    healthcheck:
      # pg_isready exits 0 when Postgres is ready to accept connections
      test: ["CMD-SHELL", "pg_isready -U optiqueue -d optiqueue"]
      interval: 5s       # Check every 5 seconds
      timeout: 5s        # Fail if check takes >5s
      retries: 10        # Try 10 times before marking unhealthy
      start_period: 10s  # Grace period before first check (Postgres init time)

  # ── REDIS ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: optiqueue-redis
    restart: unless-stopped
    command: >
      redis-server
      --save 60 1
      --loglevel warning
    # --save 60 1: persist to disk if ≥1 key changes in 60s (RDB snapshot).
    # In prod you'd also use AOF (appendonly yes) for durability.
    # For this project, RDB is enough — heartbeat data is ephemeral anyway.
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    networks:
      - optiqueue_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ── APPLICATION ────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: optiqueue-app
    restart: unless-stopped
    environment:
      # DB connection uses Docker service name "postgres" as hostname.
      # Docker's internal DNS resolves "postgres" → container IP automatically.
      DB_URL: jdbc:postgresql://postgres:5432/optiqueue
      DB_USER: optiqueue
      DB_PASS: optiqueue
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SERVER_PORT: "8080"
      WORKER_POOL_SIZE: "4"
      WORKER_QUEUE_CAP: "100"
      RETRY_MAX: "5"
      RETRY_DELAY_MS: "1000"
      HEARTBEAT_MS: "5000"
      HEARTBEAT_TTL_MS: "15000"
      # Unique worker ID per container instance.
      # On Oracle Cloud with multiple containers, each gets a different ID.
      WORKER_ID: "worker-1"
    ports:
      - "8080:8080"
    networks:
      - optiqueue_net
    depends_on:
      postgres:
        condition: service_healthy    # Wait for pg_isready to pass
      redis:
        condition: service_healthy    # Wait for redis-cli ping to pass
    healthcheck:
      # Spring Actuator's /health returns 200 when app is ready.
      # We use wget (built into Alpine) — curl is not always available.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s   # Spring Boot + Flyway migration takes ~20-30s on cold start
